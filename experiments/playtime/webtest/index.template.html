<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>Playtime: __SCENE__</title>
    <style>
      /* Lora italic 500 (webtest/fonts/, SIL Open Font License: fonts/OFL.txt), latin and latin-ext
         as Google Fonts cuts them, so the page needs nothing from the internet. */
      @font-face {
        font-family: 'Lora'; font-style: italic; font-weight: 500; font-display: swap;
        src: url(fonts/lora-italic-500-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Lora'; font-style: italic; font-weight: 500; font-display: swap;
        src: url(fonts/lora-italic-500-latin.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                   background: rgb(245, 245, 220); font-family: arial; }
      #canvas { position: absolute; top: 0; left: 0; border: 0; visibility: hidden; }
      /* One message over the game: 'Loading…' until the game's first frame, then 'Click the screen to
         start' (browsers only start audio after a click or key), then gone. */
      #message { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                 background: rgb(245, 245, 220); user-select: none; text-align: center; padding: 16px;
                 font-family: 'Lora', Georgia, serif; font-weight: 500; font-style: italic;
                 font-size: clamp(28px, 6vw, 64px); color: rgb(60, 60, 60); }
      #message.waiting { background: rgba(245, 245, 220, 0.6); cursor: pointer; }
      #message.playing { display: none; }
    </style>
  </head>
  <body>
    <!-- made by webtest/build-web.sh from index.template.html; __SCENE__ is the scene -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <div id="message">Loading…</div>
    <script>
      function resizeCanvas() {
        var canvas = document.getElementById('canvas');
        var dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
      }

      // The message: 'loading' (opaque), 'waiting' (see-through, asks for a click), 'playing' (gone).
      var screen = { state: 'loading', clicked: false };
      function setScreen(state, text) {
        var message = document.getElementById('message');
        screen.state = state;
        message.className = state;
        if (text) message.textContent = text;
      }
      // The game's first frame (src/web-bridge.lua says 'ready' then): ask for the click, unless one
      // already came while it loaded.
      function gameReady() {
        if (screen.state !== 'loading') return;
        if (screen.clicked) setScreen('playing');
        else setScreen('waiting', 'Click the screen to start');
      }

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };
      window.addEventListener('keydown', function (e) {
        if ([32, 37, 38, 39, 40, 9].indexOf(e.keyCode) > -1) e.preventDefault(); // tab toggles the editor
      }, false);
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      // The synth: src/synth-web.lua prints each frame's synth calls as one '@desound' line;
      // they go to the engine (desound.wasm) in an AudioWorklet (desound-processor.js).
      // Browsers only start audio after a click or key, so the calls wait until then.
      var desound = { built: __SYNTH__, node: null, context: null, waiting: [] }; // built: has desound.wasm
      function desoundSend(line) {
        var parts = line.split('\t');
        var message = { t: Number(parts[1]), calls: parts.slice(2) };
        if (desound.node) { desound.node.port.postMessage(message); return; }
        // before audio starts keep only the setup (patches, reverb), not old notes; every frame
        // sends the listener again anyway
        message.calls = message.calls.filter(function (c) { return /^(instrument|reverb|spatial_speed)/.test(c); });
        if (message.calls.length > 0) desound.waiting.push(message);
      }
      // On every click or key: start the audio the first time, and wake it if the browser put it to sleep.
      function desoundStart() {
        if (!desound.built) return;
        if (desound.context) {
          if (desound.context.state === 'suspended') desound.context.resume();
          return;
        }
        var context = new AudioContext({ sampleRate: 44100 }); // the engine's rate
        desound.context = context;
        Promise.all([
          context.audioWorklet.addModule('desound-processor.js'),
          fetch('desound.wasm').then(function (r) { return r.arrayBuffer(); })
        ]).then(function (results) {
          var node = new AudioWorkletNode(context, 'desound', {
            numberOfInputs: 0, outputChannelCount: [2], processorOptions: { wasm: results[1] }
          });
          node.port.onmessage = function (e) {
            if (e.data.error) console.error('desound:', e.data.error, e.data.calls);
            else if (e.data.print) console.log('desound:', e.data.print);
            else console.log('desound:', JSON.stringify(e.data));
          };
          node.connect(context.destination);
          desound.waiting.forEach(function (m) { node.port.postMessage(m); });
          desound.waiting = [];
          desound.node = node;
          context.resume();
        }).catch(function (e) { console.error('desound:', e); });
      }
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
        window.addEventListener(type, desoundStart);
      });

      // A click or key takes the message away (or, while loading, means it won't be asked for);
      // the same click starts the audio above.
      function onFirstClick() {
        screen.clicked = true;
        if (screen.state === 'waiting') setScreen('playing');
      }
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
        window.addEventListener(type, onFirstClick);
      });

      // Lua eval into the running game (src/web-bridge.lua): playtime.eval('return #state.mipos')
      // resolves to {ok, data} or {ok: false, error}, like the desktop bridge's /eval. The code goes
      // in as a file in the game's save directory; the answer comes back as an '@bridge' line.
      var playtime = { dir: null, next: 0, waiting: {}, queued: [] };
      function playtimeWrite(id, code) {
        Module.FS_createDataFile(playtime.dir, id + '.lua', code, true, true);
      }
      playtime.eval = function (code) {
        return new Promise(function (resolve) {
          var id = String(++playtime.next).padStart(8, '0'); // sorted by name = run in order
          playtime.waiting[id] = resolve;
          if (playtime.dir) playtimeWrite(id, code);
          else playtime.queued.push([id, code]);
        });
      };
      function playtimeAnswer(line) {
        var parts = line.split('\t');
        var data = JSON.parse(parts[2]);
        if (parts[1] === 'ready') {
          gameReady();
          playtime.dir = data.dir;
          playtime.queued.forEach(function (q) { playtimeWrite(q[0], q[1]); });
          playtime.queued = [];
        } else if (playtime.waiting[parts[1]]) {
          playtime.waiting[parts[1]](data);
          delete playtime.waiting[parts[1]];
        }
      }

      var Module = {
        arguments: ['./game.love', '--play', '__SCENE__'],
        INITIAL_MEMORY: 268435456,
        print: function (line) {
          if (line.indexOf('@desound\t') === 0) desoundSend(line);
          else if (line.indexOf('@bridge\t') === 0) playtimeAnswer(line);
          else console.log(line);
        },
        printErr: console.error.bind(console),
        canvas: (function () {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener('webglcontextlost', function (e) {
            alert('WebGL context lost. Reload the page.'); e.preventDefault();
          }, false);
          canvas.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
          return canvas;
        })(),
        // love.js reports download progress here; '' when the files are in (Lua still has to start).
        setStatus: function (text) {
          if (screen.state === 'loading' && /error/i.test(text || '')) setScreen('loading', 'Something went wrong (see the console)');
          if (!text && Module.remainingDependencies === 0) {
            document.getElementById('canvas').style.visibility = 'visible';
            resizeCanvas();
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : '');
        }
      };
      Module.setStatus('Downloading...');
      window.onerror = function () { Module.setStatus('Error, see the JavaScript console'); };

      var applicationLoad = function () {
        Love(Module);
        var tries = 0;
        var timer = setInterval(function () {
          resizeCanvas();
          window.dispatchEvent(new Event('resize'));
          if (++tries > 20) clearInterval(timer);
        }, 200);
      };
    </script>
    <script src="game.js"></script>
    <script async src="love.js" onload="applicationLoad(this)"></script>
  </body>
</html>
